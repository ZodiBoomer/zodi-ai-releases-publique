name: Validate release automation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "latest.json"
      - "README.md"

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@v1.7.7
