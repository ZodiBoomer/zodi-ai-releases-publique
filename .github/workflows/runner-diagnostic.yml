name: Temporary GitHub-hosted runner diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runner-diagnostic.yml"

permissions:
  contents: read

jobs:
  runner-check:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm runner assignment
        run: |
          echo "GitHub-hosted runner started successfully."
          echo "OS: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"
